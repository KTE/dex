# Publishes packages/website to GitHub Pages, served at dex.ars.is
#
# There is no build step: the directory is uploaded as-is.
# The custom domain is stored in the repository's Pages settings, not in a CNAME
# file - GitHub ignores CNAME files when a site is published from a workflow.

name: website

on:
  push:
    branches: [main]
    paths:
      - packages/website/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read # actions/checkout
  pages: write # create the Pages deployment
  id-token: write # OIDC token that proves the artifact came from this repo

# One deployment at a time. Do not cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7 # v7.0.1
      - uses: actions/configure-pages@v6 # v6.0.0
      - uses: actions/upload-pages-artifact@v5 # v5.0.0
        with:
          path: packages/website
      - id: deployment
        uses: actions/deploy-pages@v5 # v5.0.0
