# Builds packages/website with Astro and publishes it to GitHub Pages,
# served at dex.ars.is
#
# The custom domain is stored in the repository's Pages settings, not in a CNAME
# file - GitHub ignores CNAME files when a site is published from a workflow.

name: website

on:
  push:
    branches: [main]
    paths:
      - packages/website/**
      - .github/workflows/pages.yml
  # Pull requests build and type-check but do not publish.
  pull_request:
    paths:
      - packages/website/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read  # actions/checkout
  pages: write  # create the Pages deployment
  id-token: write  # OIDC token that proves the artifact came from this repo

# One deployment at a time. Do not cancel a run that is mid-publish.
# Pull requests get their own group so a PR build never queues behind a deploy.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/website
    steps:
      - uses: actions/checkout@v7  # v7.0.1

      # Reads the pnpm version from the package's "packageManager" field.
      # The path is relative to the repository root, not to working-directory.
      - uses: pnpm/action-setup@v6  # v6.0.10
        with:
          package_json_file: packages/website/package.json

      - uses: actions/setup-node@v7  # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

      # Publishing steps only. A pull request stops after check + build above.
      - uses: actions/configure-pages@v6  # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5  # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: packages/website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5  # v5.0.0
