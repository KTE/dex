# Build the dex-loop Debian package for Raspberry Pi gallery devices.
#
# WHY A CONTAINER ON AN ARM RUNNER
# --------------------------------
# The package's whole purpose is that `Depends:` is derived from the sonames
# the binary actually links (dpkg-shlibdeps, see Cargo.toml's `depends =
# "$auto"`), so that apt refuses a libmpv ABI mismatch at install time on a
# bench rather than letting it surface as a black screen in a gallery.
#
# That guarantee is only worth anything if the build environment IS the target
# environment. `ubuntu-24.04-arm` gives us native arm64 (free on public repos,
# no qemu), but it is Ubuntu -- linking against Ubuntu's libmpv and then
# installing on Debian trixie would produce exactly the mismatch this package
# exists to prevent. So: arm64 runner for the architecture, debian:trixie
# container for the ABI.
#
# Verify the pairing whenever the fleet moves to a new Debian release:
#   ssh <pi> '. /etc/os-release; echo $VERSION_CODENAME; dpkg -s libmpv2'
#
# TOOLCHAIN: DEBIAN'S RUSTC, NOT RUSTUP
# ------------------------------------
# rustc and cargo are installed with apt, from the same archive the devices
# use, so CI compiles with the compiler the fleet actually has (trixie: 1.85).
# This was originally rustup stable, which was inconsistent with the paragraph
# above: a container that supplies the target's libraries but not its compiler
# is only half a target environment.
#
# What it buys: the Pi is a development host, and it can only keep building its
# own software while the crate stays inside trixie's Rust. With rustup here,
# "builds in CI" and "builds on the device" are separate claims, and the day
# they diverge is the day someone discovers it by hand -- which is how the
# cargo-deb MSRV gap below was found.
#
# The cost is real and deliberate: Debian's rustc lags, so a dependency needing
# a newer compiler cannot be adopted. That constraint should be felt HERE, on a
# red build, rather than at deploy time. `rust-version` in Cargo.toml states
# the same floor; this job is what enforces it.
name: dex-loop deb

# NOTE ON TRIGGERS. This originally fired only on `dex-loop-v*` tags, plus
# workflow_dispatch — which meant it could not run AT ALL:
#   * workflow_dispatch only registers for workflows present on the DEFAULT
#     branch, and this file lives on the experiment branch, so it never appeared
#     in the Actions UI or `gh workflow list`;
#   * and a branch push matched nothing, because only `tags:` was listed.
# Four jobs that never execute report the same green nothing as four jobs that
# pass. Branch pushes are also what CI is FOR: linting and packaging checks that
# only run at release time cannot prevent the release.
on:
  workflow_dispatch:
  push:
    branches: ["main", "experiment/**"]
    tags: ["dex-loop-v*"]
    paths:
      - "experiments/2026-08-12-4k-hevc-perfect-loop/dex-loop/**"
      - "experiments/2026-08-12-4k-hevc-perfect-loop/scripts/**"
      - ".github/workflows/dex-loop-deb.yml"
  pull_request:
    paths:
      - "experiments/2026-08-12-4k-hevc-perfect-loop/dex-loop/**"
      - "experiments/2026-08-12-4k-hevc-perfect-loop/scripts/**"
      - ".github/workflows/dex-loop-deb.yml"

permissions:
  contents: read

env:
  CRATE_DIR: experiments/2026-08-12-4k-hevc-perfect-loop/dex-loop

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie

    steps:
      - name: Install build dependencies
        run: |
          set -eux
          apt-get update
          # libmpv-dev is what the crate links; dpkg-dev provides
          # dpkg-shlibdeps, which is what turns those links into Depends.
          # rustc/cargo come from DEBIAN, not rustup -- see "Toolchain" below.
          # libmpv-dev is what the crate links; dpkg-dev provides
          # dpkg-shlibdeps, which is what turns those links into Depends.
          apt-get install -y --no-install-recommends \
            build-essential pkg-config ca-certificates git \
            rustc cargo rust-clippy libmpv-dev dpkg-dev lintian
          # Record what we built and linked against. When a future .deb refuses
          # to install on a device, these lines in the log are the first thing
          # to compare against the device's own `dpkg -s libmpv2` / rustc -V.
          dpkg -s libmpv2 | grep -E '^(Package|Version):'
          rustc --version
          cargo --version

      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CRATE_DIR }}/target
          key: dex-loop-deb-${{ hashFiles('experiments/2026-08-12-4k-hevc-perfect-loop/dex-loop/Cargo.lock') }}
          restore-keys: dex-loop-deb-

      # Pinned to the 2.x line: cargo-deb 3.7 uses let-chains and needs rustc
      # >= 1.88, which trixie does not have. The pin is a CONSEQUENCE of the
      # toolchain decision, not an independent choice -- if this ever has to be
      # unpinned, the toolchain question is what actually changed.
      - name: Install cargo-deb
        run: command -v cargo-deb || cargo install --locked cargo-deb --version "^2"

      # The package is only worth shipping if the code it contains passes. The
      # full suite runs here because this container HAS libmpv -- the Mac
      # checkout cannot link the binary at all, so `cargo test --lib` is the
      # most a developer machine can do.
      - name: Clippy
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo test --release

      - name: Build package
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo deb

      # Print the derived Depends into the log. If dpkg-shlibdeps ever silently
      # stops resolving libmpv, the package would still build and would still
      # install -- onto a device with no libmpv, failing at runtime. Asserting
      # it here keeps that from being a silent success.
      - name: Verify derived dependencies
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          set -eux
          deb=$(find target/debian -name '*.deb' -print -quit)
          test -n "$deb"
          dpkg-deb --field "$deb" Package Version Architecture Depends
          dpkg-deb --contents "$deb"
          dpkg-deb --field "$deb" Depends | grep -q libmpv \
            || { echo "::error::Depends does not mention libmpv — dpkg-shlibdeps did not resolve it"; exit 1; }
          # The BEHAVIOURAL floor, which dpkg-shlibdeps cannot derive: left to
          # $auto alone the answer is `libmpv2 (>= 0.19.0)`, the oldest version
          # exporting the symbols we call. What we actually require is 0.40
          # behaviour (drmprime-overlay; END_FILE(reason=stop) on a loadfile
          # replace). Asserted here because deleting the explicit constraint in
          # Cargo.toml would still produce a package that builds and installs.
          dpkg-deb --field "$deb" Depends | grep -qE 'libmpv2 \(>= 0\.(4[0-9]|[5-9][0-9])' \
            || { echo "::error::Depends lost its explicit libmpv2 >= 0.40 floor"; exit 1; }

      # Policy check on the built package. --fail-on error,warning is the point:
      # a linter that reports and exits 0 is a linter nobody reads. Accepted
      # tags live in deploy/lintian-overrides WITH their reasoning, so silencing
      # one is a reviewable diff rather than a flag on a command line.
      - name: Lintian
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          set -eux
          deb=$(find target/debian -name '*.deb' -print -quit)
          lintian --tag-display-limit 0 --fail-on error,warning "$deb"

      - uses: actions/upload-artifact@v4
        with:
          name: dex-loop-deb
          path: ${{ env.CRATE_DIR }}/target/debian/*.deb
          if-no-files-found: error

  # Static checks on what we SHIP but do not compile: the systemd unit and the
  # shell. Separate job so it reports independently of the package build and
  # runs even when the build breaks -- these findings are usually the cause.
  lint:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Install linters
        run: |
          set -eux
          apt-get update
          # devscripts provides checkbashisms; systemd provides systemd-analyze.
          apt-get install -y --no-install-recommends \
            shellcheck devscripts systemd git ca-certificates reuse

      - uses: actions/checkout@v4

      # THE reason this job exists. systemd silently ignores directives it does
      # not recognise in a given section, so a typo or a section-migrated key is
      # invisible at runtime -- the unit starts fine and simply does less than
      # it says. That is how StartLimitIntervalSec=0 sat in [Service] doing
      # nothing (fixed 2026-08-15): the most safety-critical line in the unit,
      # ignored, while reading as though it worked.
      #
      # The two "Command ... is not executable" notices are expected here: the
      # binaries live in the package, which is not installed in this container.
      - name: systemd-analyze verify
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          set -eux
          out=$(systemd-analyze verify deploy/dex-loop.service 2>&1 || true)
          echo "$out"
          # Fail on anything that is NOT the known not-installed noise.
          if echo "$out" | grep -vE 'is not executable|^$' | grep -q .; then
            echo "::error::systemd-analyze reported problems with dex-loop.service"
            echo "$out" | grep -vE 'is not executable|^$'
            exit 1
          fi

      # Maintainer scripts run as root on every device, and run under /bin/sh --
      # dash on Debian, not bash. A bashism there fails an install in the field,
      # on a machine nobody is sitting at.
      - name: Shell checks
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          set -eux
          shellcheck deploy/dex-wait-hdmi deploy/maintainer-scripts/*
          checkbashisms deploy/maintainer-scripts/*

      # The harness the bench depends on. Not shipped, but a broken measurement
      # script costs a whole soak run.
      - name: Shellcheck the bench harness
        working-directory: experiments/2026-08-12-4k-hevc-perfect-loop
        run: shellcheck scripts/*.sh

      # REUSE (reuse.software): every file must carry copyright and licence
      # information, machine-readably. dex aims to be installable from all the
      # usual repos, and distro packagers are precisely the people who need a
      # precise per-file answer -- this makes it checkable rather than asserted.
      #
      # Scoped to the crate with --root. Repo-wide compliance is the eventual
      # goal but is blocked on the GPL-inherited packages (pi-gen -> dex-os),
      # whose licensing is not settled; annotating those unilaterally would be
      # making a claim rather than recording one.
      - name: REUSE lint
        working-directory: ${{ env.CRATE_DIR }}
        run: reuse --root . lint

  # Turns SPEC §5c's dependency policy into a gate: advisories, a trimmed
  # licence allow-list, and a ban on the proc-macro toolchain (see deny.toml —
  # the "serde without derive" decision is otherwise only a comment).
  #
  # Runs on the bare runner with rustup, NOT in the trixie container. That is
  # consistent with the toolchain rule rather than an exception to it: the rule
  # binds what BUILDS THE SHIPPED ARTIFACT, so it stays inside the container.
  # cargo-deny produces nothing that ships and needs a newer rustc than trixie
  # has, exactly like cargo-deb — the difference is that cargo-deb builds the
  # package, so it had to be pinned instead.
  deny:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        run: |
          set -eux
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: cargo deny check
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install --locked cargo-deny
          cargo deny check

  # Install / remove / purge lifecycle. This is the class of bug that only
  # appears when a package is really installed and removed — maintainer scripts
  # that fail, files that outlive a purge, users never created — and no static
  # linter reaches it.
  #
  # This started as piuparts and is not, because piuparts has no installation
  # candidate on Ubuntu noble/arm64 (it is simply not published for that arch),
  # and inside a container it could not have used --docker-image anyway. The
  # container IS a throwaway environment, which is the only thing piuparts's
  # chroot was providing here, so the test runs directly.
  #
  # What is genuinely lost by not using piuparts: upgrade testing from a
  # previous version (there is none yet) and its much broader leftover
  # heuristics. The filesystem diff below is a deliberately narrow substitute.
  lifecycle:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dex-loop-deb

      - name: Install / remove / purge
        run: |
          set -eux
          apt-get update
          deb=$(find . -name '*.deb' -print -quit); test -n "$deb"

          # Snapshot the filesystem so a purge can be checked for leftovers.
          snap() { find / -xdev \( -path /proc -o -path /sys -o -path /run -o -path /tmp \
                     -o -path /var/log -o -path /var/lib/apt -o -path /var/cache \
                     -o -path /var/lib/dpkg -o -path /github \) -prune -o -print 2>/dev/null | sort; }
          snap > /before.txt

          apt-get install -y "./${deb#./}"

          # --- postinst did what it promises ---
          test -x /usr/bin/dex-loop
          test -x /usr/bin/dex-wait-hdmi
          getent passwd dex                       # the service user exists
          id -nG dex | grep -qw video             # ...and can open /dev/dri
          id -nG dex | grep -qw render
          test -d /opt/dex                        # asset directory created
          test -f /lib/systemd/system/dex-loop.service
          test -f /usr/share/man/man1/dex-loop.1.gz
          # The package must NOT ship an asset: artwork is content, not software.
          test ! -e /opt/dex/loop.265

          apt-get remove -y dex-loop
          test ! -e /usr/bin/dex-loop             # binary gone
          getent passwd dex                       # user RETAINED, by design
          test -d /opt/dex                        # artwork RETAINED, by design

          apt-get purge -y dex-loop
          test ! -e /lib/systemd/system/dex-loop.service
          getent passwd dex                       # still retained after purge
          test -d /opt/dex

          # --- leftovers ---
          # Exactly two are intended, both deliberate in postrm: /opt/dex holds
          # artwork the package never shipped, and `dex` may be referenced by
          # anything the operator wrote. A THIRD leftover is a bug, so this
          # diffs rather than trusting the exit code.
          snap > /after.txt
          if ! diff <(grep -v '^/opt/dex' /before.txt) <(grep -v '^/opt/dex' /after.txt) > /leftovers.diff; then
            echo "::error::purge left files behind beyond the two intended:"
            cat /leftovers.diff
            exit 1
          fi
          echo "lifecycle OK — install, remove and purge all behave as designed"
