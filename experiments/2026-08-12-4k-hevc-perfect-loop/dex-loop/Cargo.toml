[package]
name = "dex-loop"
version = "0.1.0"
edition = "2021"
description = "Gapless HEVC looper: libmpv fed by an endless in-process byte stream"
# The dex project's policy: public domain wherever the project is free to
# choose. It is free to choose here — this crate is written from scratch and
# its cargo dependencies are all MIT/Apache-2.0.
#
# This describes THE SOURCE ONLY. The .deb links libmpv, which Debian ships as
# GPL-3+ (it links GPL-3+ libsmbclient), so the shipped binary is a combined
# work conveyed under GPL-3+. No conflict — CC0 is GPL-compatible, and the two
# statements are about different artifacts. See LICENSE, which the package
# embeds verbatim as its copyright file so the distinction ships with it.
license = "CC0-1.0"
# The compiler Debian trixie ships, which is what the Pi has. The device is a
# development host, so the crate must stay buildable with the fleet's own
# toolchain — CI compiles with apt's rustc to enforce it, not rustup's stable.
# Raising this floor is a decision about whether devices can still build their
# own software, not a routine bump.
rust-version = "1.85"

# Dependencies are DECLARED, not avoided — SPEC §5c. This binary links libmpv
# and, transitively, 228 shared objects; a rule that forbade three small cargo
# crates while linking that was bookkeeping, not restraint. The requirement is
# that the set stays small enough to read: 16 crates, no proc macros.
#
#   serde_json  Replaces a 585-line hand-rolled JSON subset parser. Its \uXXXX
#               and UTF-16 surrogate-pair handling is load-bearing, not
#               decoration: Python's json.dumps escapes ALL non-ASCII by
#               default, and a sidecar's informational `source` key can hold
#               any filename, so refusing escapes would refuse byte-perfect
#               assets over an ingest tool's serializer settings.
#   serde       For the map visitor ONLY — no `derive` feature, so no
#               syn/quote/proc-macro2 on the build's critical path. Needed
#               because the sidecar grammar REJECTS duplicate keys, which
#               serde_json's last-wins Map cannot express.
#   sha2        Replaces a hand-rolled SHA-256. Confirmed byte-identical on the
#               real bench assets before the swap, so sidecars already in the
#               field stay valid — a hash change is a data-format change.
[dependencies]
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"

# --- Debian package (SPEC §5c) ----------------------------------------------
# `cargo deb` builds dex-loop_<version>_arm64.deb. The package exists to make
# the dependency set CHECKED rather than merely written down: libmpv's version
# is verified by apt at install time, on a bench, instead of surfacing as a
# black screen in a gallery.
#
# Build:   cargo deb            (on arm64; CI does it in a debian:trixie container)
# Install: sudo apt install ./dex-loop_0.1.0_arm64.deb
[package.metadata.deb]
maintainer = "Max Albrecht <1@178.is>"
copyright = "Max Albrecht"
# Ship LICENSE verbatim as the package's copyright file. Without this, cargo-deb
# emits `License: CC0-1.0` alone — true of the source and misleading about the
# binary, which is a GPL-3+ combined work. A package that understates its own
# obligations is the one licensing bug worth going out of the way to avoid.
license-file = ["LICENSE", 0]
extended-description = """
Gapless 4K HEVC loop player for Raspberry Pi gallery installations. Feeds
libmpv an endless in-process byte stream so the decoder never sees EOF and
never seeks, which is what removes the seam at the loop point."""
section = "video"
priority = "optional"

# THE POINT OF THE PACKAGE. "$auto" runs dpkg-shlibdeps over the built binary,
# so Depends is DERIVED from the sonames it actually links -- libmpv2 and the
# rest -- and cannot drift from reality the way a hand-written list would.
# Never replace this with a literal list.
#
# The explicit libmpv2 floor is ADDED to it, not a substitute, because the two
# state different things and only one of them is derivable:
#
#   $auto alone produced `libmpv2 (>= 0.19.0)`. That is dpkg-shlibdeps working
#   correctly -- it reports the oldest version providing the SYMBOLS we call.
#   But nothing we depend on is symbol-shaped: --gpu-hwdec-interop=drmprime-
#   overlay is a runtime option, and the C1 recovery fix rests on mpv emitting
#   END_FILE(reason=stop) for a `loadfile replace`. Both are BEHAVIOUR, both
#   were verified against 0.40 (the version trixie ships and all three reviews
#   probed), and a device with 0.19 would install cleanly and then misbehave --
#   the silent-wrongness class this package was built to close.
#
# So: keep $auto for what can be derived, and state what cannot. Raise the
# floor whenever a fix is verified against a newer mpv.
depends = "$auto, libmpv2 (>= 0.40.0)"

assets = [
    # /usr/bin, not /usr/local/bin: Debian policy reserves /usr/local for the
    # local administrator, and a package that writes there is a policy
    # violation. The systemd unit was updated to match.
    ["target/release/dex-loop", "usr/bin/", "755"],
    ["deploy/dex-wait-hdmi", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/dex-loop/", "644"],
]

# sidecar-check is deliberately NOT shipped: it is an INGEST tool (it validates
# a sidecar against an asset while building one), and ingest happens on a
# workstation, never on the gallery device.

maintainer-scripts = "deploy/maintainer-scripts"

[package.metadata.deb.systemd-units]
unit-scripts = "deploy"
# Enable at install so a device that is only ever power-cycled comes back
# playing, but do not start during install: the unit takes DRM master, and an
# operator installing over SSH from a console session should choose the moment.
enable = true
start = false

# Match release: an unwind crossing the FFI boundary, or main unwinding while
# mpv threads are live, is UB territory. rustc >= 1.81 aborts at the extern "C"
# boundary, but main() unwinding out from under a registered callback is a
# separate hazard, and a dev build should not have a weaker safety story than
# the shipping one.
[profile.dev]
panic = "abort"

[profile.release]
opt-level = 2
lto = true
panic = "abort"
